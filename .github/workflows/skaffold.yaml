%YAML 1.1
---
jobs:
  build-render:
    name: Build & Render
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
    - continue-on-error: true
      id: createGithubAppToken
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.OPERATOR_APP_CLIENT_ID }}
        permission-contents: read
        private-key: ${{ secrets.OPERATOR_PRIVATE_KEY }}
    - uses: shikanime-labs/actions/checkout@v9
      with:
        github-token: ${{ steps.createGithubAppToken.outputs.token || 
          secrets.GITHUB_TOKEN }}
    - uses: docker/login-action@v4
      with:
        password: ${{ secrets.GITHUB_TOKEN }}
        registry: ghcr.io
        username: ${{ github.actor }}
    - uses: shikanime-labs/actions/nix/setup@v9
      with:
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
        extra-platforms: arm64
        github-token: ${{ steps.createGithubAppToken.outputs.token || 
          secrets.GITHUB_TOKEN }}
    - id: direnv
      uses: shikanime-labs/actions/direnv@v9
    - id: skaffold
      uses: shikanime-labs/actions/skaffold/integration@v9
      with:
        push: ${{ inputs.push }}
    - env:
        SKAFFOLD_MANIFEST: ${{ steps.skaffold.outputs.manifest }}
      name: Save manifest
      run: "mkdir -p artifacts\ncat > artifacts/skaffold-manifest.yaml <<'MANIFEST_EOF'\n\
        $SKAFFOLD_MANIFEST\nMANIFEST_EOF\n"
      shell: bash
    - uses: actions/upload-artifact@v4
      with:
        name: skaffold-manifest
        path: artifacts/skaffold-manifest.yaml
  build-render-profile:
    if: ${{ needs['setup-profiles-jobs'].outputs.continue == 'true' }}
    name: Build & Render (Profile)
    needs:
    - setup-profiles-jobs
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
    - continue-on-error: true
      id: createGithubAppToken
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.OPERATOR_APP_CLIENT_ID }}
        permission-contents: read
        private-key: ${{ secrets.OPERATOR_PRIVATE_KEY }}
    - uses: shikanime-labs/actions/checkout@v9
      with:
        github-token: ${{ steps.createGithubAppToken.outputs.token || 
          secrets.GITHUB_TOKEN }}
    - uses: docker/login-action@v4
      with:
        password: ${{ secrets.GITHUB_TOKEN }}
        registry: ghcr.io
        username: ${{ github.actor }}
    - uses: shikanime-labs/actions/nix/setup@v9
      with:
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
        extra-platforms: arm64
        github-token: ${{ steps.createGithubAppToken.outputs.token || 
          secrets.GITHUB_TOKEN }}
    - id: direnv
      uses: shikanime-labs/actions/direnv@v9
    - uses: shikanime-labs/actions/skaffold/integration@v9
      with:
        profile: ${{ matrix.name }}
        push: ${{ inputs.push }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs['setup-profiles-jobs'].outputs.matrix) }}
  setup-profiles-jobs:
    name: Setup Profiles Jobs
    outputs:
      continue: ${{ steps.setup-profiles-jobs.outputs.continue }}
      matrix: ${{ steps.setup-profiles-jobs.outputs.matrix }}
    runs-on: ubuntu-latest
    steps:
    - continue-on-error: true
      id: createGithubAppToken
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.OPERATOR_APP_CLIENT_ID }}
        permission-contents: read
        private-key: ${{ secrets.OPERATOR_PRIVATE_KEY }}
    - uses: shikanime-labs/actions/checkout@v9
      with:
        github-token: ${{ steps.createGithubAppToken.outputs.token || 
          secrets.GITHUB_TOKEN }}
    - uses: shikanime-labs/actions/nix/setup@v9
      with:
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
        extra-platforms: arm64
        github-token: ${{ steps.createGithubAppToken.outputs.token || 
          secrets.GITHUB_TOKEN }}
    - id: setup-profiles-jobs
      uses: shikanime-labs/actions/skaffold/setup-profiles-jobs@v9
name: Skaffold
'on':
  workflow_call:
    inputs:
      push:
        default: true
        description: Whether to push images during build
        type: boolean
    secrets:
      CACHIX_AUTH_TOKEN:
        required: true
      OPERATOR_PRIVATE_KEY:
        required: true
  workflow_dispatch: {}
permissions:
  contents: read
