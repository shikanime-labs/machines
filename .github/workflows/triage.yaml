%YAML 1.1
---
jobs:
  triage:
    runs-on: ubuntu-slim
    steps:
    - continue-on-error: true
      id: createGithubAppToken
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
      with:
        client-id: ${{ vars.OPERATOR_APP_CLIENT_ID }}
        permission-contents: read
        permission-pull-requests: write
        private-key: ${{ secrets.OPERATOR_PRIVATE_KEY }}
    - uses: shikanime-labs/actions/nix/setup@5993d4d95befc190a14c0d143583683d203ad8d1 # v9
      with:
        github-token: ${{ steps.createGithubAppToken.outputs.token || 
          secrets.GITHUB_TOKEN }}
    - uses: shikanime-labs/actions/checkout@5993d4d95befc190a14c0d143583683d203ad8d1 # v9
      with:
        github-token: ${{ steps.createGithubAppToken.outputs.token || 
          secrets.GITHUB_TOKEN }}
    - env:
        GH_TOKEN: ${{ steps.createGithubAppToken.outputs.token || 
          secrets.GITHUB_TOKEN }}
      if: github.event.pull_request.user.login == 'dependabot[bot]' || 
        github.event.pull_request.user.login == 'yorha-operator-6o[bot]'
      run: gh pr edit "${{ github.event.pull_request.number }}" --add-label 
        dependencies
    - env:
        GH_TOKEN: ${{ steps.createGithubAppToken.outputs.token || 
          secrets.GITHUB_TOKEN }}
      if: startsWith(github.head_ref, 'gh/') && endsWith(github.head_ref, 
        '/head')
      run: gh pr edit "${{ github.event.pull_request.number }}" --add-label 
        ghstack
name: Triage
'on':
  pull_request:
    types:
    - opened
    - synchronize
permissions:
  pull-requests: write
