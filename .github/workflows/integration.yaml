name: Integration
permissions:
  contents: read
jobs:
  nix:
    if:
      ${{ github.event_name == 'workflow_call' || github.event_name ==
      'workflow_dispatch' || github.event.pull_request.draft == false }}
    permissions:
      contents: read
      packages: write
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      OPERATOR_PRIVATE_KEY: ${{ secrets.OPERATOR_PRIVATE_KEY }}
    uses: ./.github/workflows/nix.yaml
    with:
      cachix-name: shikanime
  skaffold:
    # Fork PRs run with a token that cannot push to org packages, and
    # skaffold builds multi-platform (which requires pushing), so the job
    # cannot succeed there. Skip it on fork PRs; it runs fully on main
    # (Release) and on same-repo PRs whose token can push.
    if:
      ${{ (github.event_name == 'workflow_call' || github.event_name ==
      'workflow_dispatch' || github.event.pull_request.draft == false)
      && !(github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository) }}
    needs:
      - nix
    permissions:
      contents: read
      packages: write
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      OPERATOR_PRIVATE_KEY: ${{ secrets.OPERATOR_PRIVATE_KEY }}
    uses: ./.github/workflows/skaffold.yaml
"on":
  pull_request:
    branches:
      - main
      - gh/*/*/base
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_call:
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false
      OPERATOR_PRIVATE_KEY:
        required: true
  workflow_dispatch: {}
