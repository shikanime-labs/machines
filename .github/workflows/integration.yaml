name: Integration
permissions:
  contents: read
jobs:
  design-approval:
    name: Design Approval Check
    uses: ./.github/workflows/design-approval.yaml
    with:
      required-artifacts: '["docs/design/architecture.md","docs/design/brand.md","docs/design/tokens.md"]'
      approval-label: "design"
    secrets: inherit
  nix:
    needs:
      - design-approval
    if:
      ${{ github.event_name == 'workflow_call' || github.event_name ==
      'workflow_dispatch' || github.event.pull_request.draft == false }}
    permissions:
      contents: read
      packages: write
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      OPERATOR_PRIVATE_KEY: ${{ secrets.OPERATOR_PRIVATE_KEY }}
    uses: ./.github/workflows/nix.yaml
    with:
      cachix-name: shikanime
  skaffold:
    if:
      ${{ github.event_name == 'workflow_call' || github.event_name ==
      'workflow_dispatch' || github.event.pull_request.draft == false }}
    needs:
      - nix
    permissions:
      contents: read
      packages: write
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      OPERATOR_PRIVATE_KEY: ${{ secrets.OPERATOR_PRIVATE_KEY }}
    uses: ./.github/workflows/skaffold.yaml
"on":
  pull_request:
    branches:
      - main
      - gh/*/*/base
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_call:
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false
      OPERATOR_PRIVATE_KEY:
        required: true
  workflow_dispatch: {}
