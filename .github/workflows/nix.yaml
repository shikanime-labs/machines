name: Nix
permissions:
  contents: read
"on":
  workflow_call:
    inputs:
      cachix-name:
        type: string
        default: ""
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false
      OPERATOR_PRIVATE_KEY:
        required: true
  workflow_dispatch:
    inputs:
      cachix-name:
        type: string
        default: ""
        description: Cachix cache name
jobs:
  checks:
    name: Checks
    if: ${{ needs['setup-checks-jobs'].outputs.continue == 'true' }}
    runs-on: ${{ matrix.runner }}
    needs:
      - setup-checks-jobs
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs['setup-checks-jobs'].outputs.matrix) }}
    steps:
      - id: createGithubAppToken
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.OPERATOR_APP_CLIENT_ID }}
          permission-contents: read
          private-key: ${{ secrets.OPERATOR_PRIVATE_KEY }}
      - uses: shikanime-labs/actions/nix/setup@5993d4d95befc190a14c0d143583683d203ad8d1
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cachix-name: ${{ inputs['cachix-name'] }}
          github-token:
            ${{ steps.createGithubAppToken.outputs.token || secrets.GITHUB_TOKEN
            }}
      - uses: shikanime-labs/actions/checkout@5993d4d95befc190a14c0d143583683d203ad8d1
        with:
          github-token:
            ${{ steps.createGithubAppToken.outputs.token || secrets.GITHUB_TOKEN
            }}
      - id: direnv
        uses: shikanime-labs/actions/direnv@5993d4d95befc190a14c0d143583683d203ad8d1
      - name: Run flake check
        run: |
          case "${{ matrix.system }}" in
            aarch64-darwin)
              # Native darwin: nix flake check covers darwinConfigurations.
              nix flake check --accept-flake-config --no-pure-eval --system "${{ matrix.system }}" ;;
            *)
              # ponytail: x86_64 runner can't cross-build aarch64 nixosConfigurations
              # (whiskers is aarch64-only). `nix flake check --system` does not scope
              # nixosConfigurations, so build only this system's packages map. The
              # flake enumerates each host under its own arch; enumerate names
              # (the `*` glob double-prepends the system and fails) and build each.
              for p in $(nix eval --raw --accept-flake-config --no-pure-eval \
                ".#packages.${{ matrix.system }}" \
                --apply 'ps: builtins.concatStringsSep " " (builtins.attrNames ps)'); do
                nix build --accept-flake-config --no-pure-eval ".#packages.${{ matrix.system }}.$p"
              done ;;
          esac
        shell: bash
  packages:
    name: Packages
    if: ${{ needs['setup-packages-jobs'].outputs.continue == 'true' }}
    runs-on: ${{ matrix.runner }}
    needs:
      - setup-packages-jobs
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs['setup-packages-jobs'].outputs.matrix) }}
    steps:
      - id: createGithubAppToken
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.OPERATOR_APP_CLIENT_ID }}
          permission-contents: read
          private-key: ${{ secrets.OPERATOR_PRIVATE_KEY }}
      - uses: shikanime-labs/actions/nix/setup@5993d4d95befc190a14c0d143583683d203ad8d1
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cachix-name: ${{ inputs['cachix-name'] }}
          github-token:
            ${{ steps.createGithubAppToken.outputs.token || secrets.GITHUB_TOKEN
            }}
      - uses: shikanime-labs/actions/checkout@5993d4d95befc190a14c0d143583683d203ad8d1
        with:
          github-token:
            ${{ steps.createGithubAppToken.outputs.token || secrets.GITHUB_TOKEN
            }}
      - id: direnv
        uses: shikanime-labs/actions/direnv@5993d4d95befc190a14c0d143583683d203ad8d1
      - uses: shikanime-labs/actions/nix/integration@5993d4d95befc190a14c0d143583683d203ad8d1
        with:
          name: ${{ matrix.name }}
          system: ${{ matrix.system }}
  setup-checks-jobs:
    name: Setup Checks Jobs
    runs-on: ubuntu-latest
    outputs:
      continue: ${{ steps.setup-checks-jobs.outputs.continue }}
      matrix: ${{ steps.setup-checks-jobs.outputs.matrix }}
    steps:
      - id: createGithubAppToken
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.OPERATOR_APP_CLIENT_ID }}
          permission-contents: read
          private-key: ${{ secrets.OPERATOR_PRIVATE_KEY }}
      - uses: shikanime-labs/actions/nix/setup@5993d4d95befc190a14c0d143583683d203ad8d1
        with:
          github-token:
            ${{ steps.createGithubAppToken.outputs.token || secrets.GITHUB_TOKEN
            }}
      - uses: shikanime-labs/actions/checkout@5993d4d95befc190a14c0d143583683d203ad8d1
        with:
          github-token:
            ${{ steps.createGithubAppToken.outputs.token || secrets.GITHUB_TOKEN
            }}
      - id: setup-checks-jobs
        uses: shikanime-labs/actions/nix/setup-checks-jobs@5993d4d95befc190a14c0d143583683d203ad8d1
  setup-packages-jobs:
    name: Setup Packages Jobs
    runs-on: ubuntu-latest
    needs:
      - checks
    outputs:
      continue: ${{ steps.setup-packages-jobs.outputs.continue }}
      matrix: ${{ steps.setup-packages-jobs.outputs.matrix }}
    steps:
      - id: createGithubAppToken
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.OPERATOR_APP_CLIENT_ID }}
          permission-contents: read
          private-key: ${{ secrets.OPERATOR_PRIVATE_KEY }}
      - uses: shikanime-labs/actions/nix/setup@5993d4d95befc190a14c0d143583683d203ad8d1
        with:
          github-token:
            ${{ steps.createGithubAppToken.outputs.token || secrets.GITHUB_TOKEN
            }}
      - uses: shikanime-labs/actions/checkout@5993d4d95befc190a14c0d143583683d203ad8d1
        with:
          github-token:
            ${{ steps.createGithubAppToken.outputs.token || secrets.GITHUB_TOKEN
            }}
      - id: setup-packages-jobs
        uses: shikanime-labs/actions/nix/setup-packages-jobs@5993d4d95befc190a14c0d143583683d203ad8d1
