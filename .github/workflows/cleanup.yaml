name: Cleanup
permissions:
  contents: read
"on":
  pull_request:
    types:
      - closed
jobs:
  cleanup:
    if: ${{ github.event.pull_request.head.repo.fork == false }}
    runs-on: ubuntu-slim
    steps:
      - id: createGithubAppToken
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.OPERATOR_APP_ID }}
          permission-contents: write
          private-key: ${{ secrets.OPERATOR_PRIVATE_KEY }}
      - uses: shikanime-studio/actions/nix/setup@68a5b49e707bb499fe73cd1b7dddb95fd4a66716 # v9
        with:
          github-token: ${{ steps.createGithubAppToken.outputs.token }}
      - uses: shikanime-studio/actions/cleanup@68a5b49e707bb499fe73cd1b7dddb95fd4a66716 # v9
        with:
          github-token: ${{ steps.createGithubAppToken.outputs.token }}
          pull-request-url: ${{ github.event.pull_request.html_url }}
