name: Update
permissions:
  contents: read
"on":
  schedule:
    - cron: 0 4 * * 0
  workflow_dispatch: {}
jobs:
  dependencies:
    runs-on: ubuntu-slim
    steps:
      - id: createGithubAppToken
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.OPERATOR_APP_ID }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
          private-key: ${{ secrets.OPERATOR_PRIVATE_KEY }}
      - uses: shikanime-studio/actions/nix/setup@68a5b49e707bb499fe73cd1b7dddb95fd4a66716 # v9
        with:
          github-token: ${{ steps.createGithubAppToken.outputs.token }}
      - uses: shikanime-studio/actions/checkout@68a5b49e707bb499fe73cd1b7dddb95fd4a66716 # v9
        with:
          github-token: ${{ steps.createGithubAppToken.outputs.token }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          sign-commits: true
          username: operator6o
      - uses: shikanime-studio/actions/update@68a5b49e707bb499fe73cd1b7dddb95fd4a66716 # v9
        with:
          github-token: ${{ steps.createGithubAppToken.outputs.token }}
          username: operator6o
  stale:
    runs-on: ubuntu-slim
    steps:
      - id: createGithubAppToken
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.OPERATOR_APP_ID }}
          permission-issues: write
          permission-pull-requests: write
          private-key: ${{ secrets.OPERATOR_PRIVATE_KEY }}
      - uses: actions/stale@1e223db275d687790206a7acac4d1a11bd6fe629 # v10
        with:
          days-before-close: 14
          days-before-stale: 30
          repo-token: ${{ steps.createGithubAppToken.outputs.token }}
          stale-issue-label: stale
          stale-pr-label: stale
