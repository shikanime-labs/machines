name: Task
description: Track a piece of well-understood work that needs doing.
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: Describe the work to be done and what done looks like.
      placeholder: Do ... so that ...
    validations:
      required: true

  - type: textarea
    id: definition_of_done
    attributes:
      label: Definition of done
      description: List the conditions that will allow this task to be considered complete.
      placeholder: "- [ ] ..."
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: References
      description: Related issues, PRs, discussions, or documents — anything that helps whoever picks this up.
      placeholder: Parent issue, prior discussion, related PRs...
    validations:
      required: false
