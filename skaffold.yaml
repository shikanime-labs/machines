apiVersion: skaffold/v4beta9
kind: Config
metadata:
  name: niximgs
build:
  artifacts:
    - custom:
        buildCommand: wharf skaffold build --flake .#automata-oci-image --option accept-flake-config=true
      image: ghcr.io/shikanime-labs/machines/automata
    - custom:
        buildCommand: wharf skaffold build --flake .#huggingface-oci-image --option accept-flake-config=true
      image: ghcr.io/shikanime-labs/machines/huggingface
    - custom:
        buildCommand: wharf skaffold build --flake .#llama-cpp-oci-image --option accept-flake-config=true
      image: ghcr.io/shikanime-labs/machines/llama-cpp
  tagPolicy:
    customTemplate:
      template: latest
